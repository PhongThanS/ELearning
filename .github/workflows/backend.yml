name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml", ".editorconfig"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml", ".editorconfig"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore ELearning.sln
          dotnet tool restore

      - name: Build (warnings as errors)
        run: dotnet build ELearning.sln --no-restore -c Release

      - name: Format check
        run: dotnet format ELearning.sln --verify-no-changes --no-restore

      # `dotnet ef`: -c là --context, cấu hình build phải ghi --configuration
      - name: Pending model changes
        run: dotnet ef migrations has-pending-model-changes -p src/ELearning.Infrastructure -s src/ELearning.Api --no-build --configuration Release

      # Integration / API test dùng Testcontainers (Docker có sẵn trên runner ubuntu).
      - name: Test
        run: dotnet test ELearning.sln --no-build -c Release --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Vulnerable packages
        run: |
          dotnet list ELearning.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q -E "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/TestResults
