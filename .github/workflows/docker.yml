name: docker

on:
  push:
    branches: [main]
    paths: ["backend/src/**", "backend/Dockerfile", "backend/*.props", "frontend/elearning-web/**", "deploy/**", "docker-compose*.yml", ".dockerignore", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/src/**", "backend/Dockerfile", "backend/*.props", "frontend/elearning-web/**", "deploy/**", "docker-compose*.yml", ".dockerignore", ".github/workflows/docker.yml"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Build images (api, migrator, web)
        run: docker compose build

      - name: Smoke test full stack
        run: |
          docker compose up -d web
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health/ready && break; sleep 3; done
          curl -fsS http://localhost:8080/health/ready
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsSI http://localhost:8080/ | grep -i "content-security-policy"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
