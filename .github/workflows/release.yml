name: release

# Build và đẩy image lên GitHub Container Registry để máy chủ chỉ cần kéo image (deploy/server/README.md).
#   push main      → :latest và :sha-<7 ký tự commit>
#   tag v1.2.3     → :1.2.3 và :sha-...
#   chạy tay       → Actions → release → Run workflow
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/src/**", "backend/Dockerfile", "backend/*.props", "frontend/elearning-web/**", "deploy/**", ".dockerignore", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: elearning-api
            dockerfile: backend/Dockerfile
            target: api
          - name: elearning-migrator
            dockerfile: backend/Dockerfile
            target: migrator
          - name: elearning-web
            dockerfile: frontend/elearning-web/Dockerfile
            target: ""
          - name: elearning-monitor
            dockerfile: deploy/monitor/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      # Tên image trên ghcr.io phải viết thường
      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
