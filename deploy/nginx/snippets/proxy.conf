proxy_http_version 1.1;
proxy_set_header Host $host;
# Nginx là điểm vào: ghi đè (không nối thêm) để client không giả mạo được IP. API chỉ tin header này
# từ dải mạng của proxy (ReverseProxy:KnownNetworks). Nếu phía trước còn load balancer, dùng module realip.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_intercept_errors off;
# HSTS do Nginx gửi ở server HTTPS; bỏ header trùng từ API
proxy_hide_header Strict-Transport-Security;
