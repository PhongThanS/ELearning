# Phần dùng chung của server HTTP (local) và HTTPS (production).
root /usr/share/nginx/html;
index index.html;

# File import Excel tối đa 5 MB (QuestionsController)
client_max_body_size 6m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

include /etc/nginx/snippets/security-headers.conf;

# API và health check: cùng domain với SPA để cookie refresh SameSite=Strict hoạt động (D-15)
# Ảnh câu hỏi qua URL đã ký (D-27): cả phòng thi sau một IP NAT tải ảnh cùng lúc khi mở đề, nên không áp limit_req;
# trình duyệt cache theo Cache-Control của API
location /api/media/ {
    proxy_pass http://api_backend;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
    limit_req zone=api_per_ip burst=400 nodelay;
    limit_req_status 429;
    proxy_pass http://api_backend;
    include /etc/nginx/snippets/proxy.conf;
}

# Chi tiết cảnh báo (số lượt quá hạn, tỉ lệ lỗi) chỉ dùng nội bộ: container monitor gọi thẳng api:8080
location = /health/alerts {
    return 404;
}

location /health/ {
    proxy_pass http://api_backend;
    include /etc/nginx/snippets/proxy.conf;
}

# Asset có hash trong tên file: cache 1 năm
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

# SPA: route phía client trả về index.html; index.html không cache để luôn lấy bản mới sau deploy
location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
}

# Trang lỗi tĩnh, không lộ thông tin nội bộ
error_page 502 503 504 /50x.html;
location = /50x.html {
    root /usr/share/nginx/errors;
    internal;
}
