# Header bảo mật (docs/07-bao-mat.md). Nginx KHÔNG kế thừa add_header khi location có add_header riêng,
# nên mọi location có add_header phải include lại file này.
# $hsts_header được định nghĩa bằng map trong template: rỗng ở HTTP (Nginx bỏ qua header rỗng)
add_header Strict-Transport-Security $hsts_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# SPA cùng origin với API (D-15): chỉ cho tải từ chính mình. style-src cần 'unsafe-inline' vì React dùng thuộc tính style.
# Markdown không render HTML thô và không có ảnh ngoài (D-17), nên không cần mở img-src / script-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
